name: Deploy to Lambda

# Lints + tests, then builds the image, pushes it to ECR, and points both
# Lambda functions (webhook + cron) at the new image. Runs on every push to
# `develop` (i.e. every merge) and can also be run manually. The deploy only
# happens if lint + tests pass.
#
# AWS is reached with the `github-cli` IAM user's access key, mounted as the
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY Actions secrets (both managed by
# Terraform in infra/github-user.tf).
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; queue a newer push behind an in-progress one.
concurrency:
  group: deploy-lambda
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: chatcheck-bot

jobs:
  # Gate: never deploy code that doesn't lint and pass tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (pytest)
        run: uv run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (github-cli IAM user)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          # Lambda rejects OCI image indexes, so keep the push a single
          # manifest: no provenance/SBOM attestations.
          docker build --platform linux/amd64 --provenance=false --sbom=false \
            -t "$IMAGE" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          # Pass the immutable, commit-pinned URI to later steps.
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Roll both Lambdas to the new image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          for fn in water_bot_webhook water_bot_cron; do
            aws lambda update-function-code --function-name "$fn" --image-uri "$IMAGE"
          done
          for fn in water_bot_webhook water_bot_cron; do
            aws lambda wait function-updated --function-name "$fn"
          done
